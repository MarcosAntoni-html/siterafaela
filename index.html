<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bim Creates | Prints</title>

  <!-- Fonte e estilo do Swiper (os carrosséis precisam deste CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="bim inicio.css">

  <style>
    /* ========== CORES E BASE ========== */
    :root {
      --rosa: #ffeff7;
      --roxo: #dabbe0;
      --fundo: #7f309e;
      --texto: #5e3570;
      --suave: #7a6584;
      --borda: #2a298f;
      --marca: #fff1a8;
      --hover: #593468;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid #ae4cbb; outline-offset: 2px;
    }

    /* ========== CABEÇALHO ========== */
    .topo {
      background: linear-gradient(120deg, var(--rosa), var(--roxo));
      color: #57124d;
      position: relative;
      z-index: 20;
    }
    .topo-conteudo {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo img { display: block; height: 90px; width: 90px; object-fit: contain; }

    .acoes { display: flex; gap: 18px; margin-left: auto; }
    .acao { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .acao img { height: 38px; width: 38px; object-fit: contain; }
    .acao:hover span { text-decoration: underline; }

    /* ========== BARRA DE BUSCA ========== */
    .busca { position: relative; flex: 1; max-width: 520px; }
    .busca-campo {
      display: flex;
      background: #fff;
      border-radius: 999px;
      padding: 4px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
    }
    .busca input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      padding: 10px 16px;
      font: inherit;
      color: var(--texto);
    }
    .busca input:focus-visible { outline: none; }
    .busca-campo:focus-within { outline: 3px solid #c55e5e; outline-offset: 2px; }
    .busca button {
      border: 0;
      border-radius: 999px;
      padding: 0 22px;
      font: inherit;
      font-weight: 500;
      color: #fff;
      background: var(--rosa);
      cursor: pointer;
    }
    .busca button:hover { background: #8e1757; }
    .busca button:focus-visible { outline-color: var(--texto); }

    .painel {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: #fff;
      color: var(--texto);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(60, 10, 70, .25);
      overflow: hidden;
    }
    .painel[hidden] { display: none; }
    .aviso { margin: 0; padding: 12px 16px; font-size: .9rem; color: var(--suave); }
    .resultados { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow-y: auto; }
    .resultados li { border-top: 1px solid var(--borda); }
    .resultados a { display: block; padding: 12px 16px; }
    .resultados a:hover, .resultados a:focus { background: var(--hover); outline: none; }
    .resultados strong { display: block; font-weight: 500; }
    .resultados span { font-size: .88rem; color: var(--suave); }
    .resultados mark { background: var(--marca); color: inherit; border-radius: 3px; padding: 0 2px; }

    /* ========== MENU ========== */
    .menu {
      list-style: none;
      margin: 0;
      padding: 10px 20px 16px;
      max-width: 1200px;
      margin-inline: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .menu a {
      display: block;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 500;
      background: rgba(255, 255, 255, .16);
      transition: background .15s;
    }
    .menu a:hover { background: rgba(255, 255, 255, .32); }
    .menu img { height: 25px; width: auto; }

    /* ========== CONTEÚDO ========== */
    main { max-width: 1200px; margin: 0 auto; padding: 40px 20px 60px; }
    .titulo-secao {
      margin: 0 0 24px;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 600;
      color: var(--rosa);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .titulo-secao::after { content: ""; flex: 1; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--roxo), transparent); }

    .carrosseis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .swiper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fff;
      border: 2px solid var(--borda);
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(172, 29, 107, .08);
      --swiper-theme-color: var(--rosa);
    }
    .swiper-slide { display: flex; align-items: center; justify-content: center; padding: 16px; }
    .swiper-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }

    /* ========== CELULAR ========== */
    @media (max-width: 900px) {
      .carrosseis { grid-template-columns: 1fr; max-width: 460px; margin: 0 auto; }
    }
    @media (max-width: 760px) {
      .topo-conteudo { flex-wrap: wrap; }
      .busca { order: 3; flex-basis: 100%; max-width: none; }
      .logo img { height: 70px; width: 70px; }
    }
    @media (prefers-reduced-motion: reduce) { .menu a { transition: none; } }
  </style>
</head>

<body>
<div class="imagemdefundo">
  <a href="bim creates logos/bacgroud.png"></a>
</div>
  <!-- ========== CABEÇALHO ========== -->
  <header class="topo">
    <div class="topo-conteudo">
      <a class="logo" href="bim inicio.html">
        <img src="bim creates logos/4 png.png" alt="Bim Creates, página inicial">
      </a>

      <!-- Busca funcional -->
      <div class="busca" role="search">
        <div class="busca-campo">
          <input type="search" id="campo-busca" placeholder="Buscar no site" aria-label="Buscar no site" autocomplete="off">
          <button type="button" id="botao-busca">Buscar</button>
        </div>
        <div class="painel" id="painel" hidden>
          <p class="aviso" id="aviso" aria-live="polite"></p>
          <ul class="resultados" id="resultados"></ul>
        </div>
      </div>

      <div class="acoes">
        <a class="acao" href="login.html">
          <img src="bim creates logos/logos/icon login.png" alt="">
          <span>Login</span>
        </a>
        <a class="acao" href="carrinho.html">
          <img src="bim creates logos/logos/icon carrinho.png" alt="">
          <span>Carrinho</span>
        </a>
      </div>
    </div>

    <!-- Menu -->
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><img src="https://em-content.zobj.net/source/animated-noto-color-emoji/461/sparkles_2728.gif" alt=""></li>
        <li><a href="bim inicio.html">Início</a></li>
        <li><a href="artes.html">Artes</a></li>
        <li><a href="Produtos.html">Produtos</a></li>
        <li><a href="Encomendas.html">Encomendas</a></li>
        <li><a href="Downloads.html">Downloads</a></li>
        <li><a href="Sobre mim.html">Sobre mim</a></li>
        <li><a href="contatos.html">Contatos</a></li>
      </ul>
    </nav>
  </header>

  <!-- ========== CONTEÚDO ========== -->
  <main>
    <h1 class="titulo-secao">Prints</h1>

    <div class="carrosseis">
      <!-- Carrossel 1 -->
      <div class="swiper carrossel-1">
        <div class="swiper-wrapper">
          <div class="swiper-slide"><img src="bim creates logos/carrocel/1.png" alt="Print 1"></div>
          <div class="swiper-slide"><img src="bim creates logos/carrocel/bode.png" alt="Print do bode"></div>
        </div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>

      <!-- Carrossel 2 -->
      <div class="swiper carrossel-2">
        <div class="swiper-wrapper">
          <div class="swiper-slide"><img src="bim creates logos/carrocel/leite.png" alt="Print do leite"></div>
          <div class="swiper-slide"><img src="bim creates logos/carrocel/noface.png" alt="Print do No-Face"></div>
        </div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>

      <!-- Carrossel 3 -->
      <div class="swiper carrossel-3">
        <div class="swiper-wrapper">
          <div class="swiper-slide"><img src="bim creates logos/carrocel/poppycat.png" alt="Print do Poppy Cat"></div>
          <div class="swiper-slide"><img src="bim creates logos/carrocel/Rafaela.png" alt="Print da Rafaela"></div>
        </div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>
    </div>
  </main>

  <!-- ========== SCRIPTS (sempre no final) ========== -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    /* ---------- Carrosséis ---------- */
    function criarCarrossel(seletor) {
      return new Swiper(seletor, {
        loop: true,
        autoplay: { delay: 3000, disableOnInteraction: false },
        pagination: { el: seletor + " .swiper-pagination", clickable: true },
        navigation: {
          nextEl: seletor + " .swiper-button-next",
          prevEl: seletor + " .swiper-button-prev"
        }
      });
    }
    criarCarrossel(".carrossel-1");
    criarCarrossel(".carrossel-2");
    criarCarrossel(".carrossel-3");

    /* ---------- Busca ---------- */

    /* 1) DADOS DA BUSCA: edite e acrescente o que quiser.
          "palavras" são termos extras que também levam ao resultado. */
    const dados = [
      { titulo: "Início",      descricao: "Página inicial da Bim Creates.",          url: "bim inicio.html", palavras: "home principal" },
      { titulo: "Artes",       descricao: "Galeria com as artes e ilustrações.",     url: "artes.html",      palavras: "ilustracao desenho galeria" },
      { titulo: "Produtos",    descricao: "Veja os produtos disponíveis.",           url: "Produtos.html",   palavras: "loja comprar" },
      { titulo: "Encomendas",  descricao: "Peça uma arte ou produto personalizado.", url: "Encomendas.html", palavras: "pedido personalizado comissao" },
      { titulo: "Downloads",   descricao: "Arquivos para baixar.",                   url: "Downloads.html",  palavras: "baixar wallpaper arquivos" },
      { titulo: "Sobre mim",   descricao: "Conheça a artista por trás da marca.",    url: "Sobre mim.html",  palavras: "quem sou historia artista" },
      { titulo: "Contatos",    descricao: "Fale comigo por redes sociais ou e-mail.", url: "contatos.html",  palavras: "contato email instagram whatsapp" },
      { titulo: "Login",       descricao: "Entre na sua conta.",                     url: "login.html",      palavras: "entrar conta minha conta" },
      { titulo: "Carrinho",    descricao: "Veja os itens do seu carrinho.",          url: "carrinho.html",   palavras: "compras pedido" },
      { titulo: "Print: Bode",       descricao: "Print disponível na seção de artes.", url: "artes.html", palavras: "bode print" },
      { titulo: "Print: Leite",      descricao: "Print disponível na seção de artes.", url: "artes.html", palavras: "leite print" },
      { titulo: "Print: No-Face",    descricao: "Print disponível na seção de artes.", url: "artes.html", palavras: "noface sem rosto print" },
      { titulo: "Print: Poppy Cat",  descricao: "Print disponível na seção de artes.", url: "artes.html", palavras: "poppycat gato print" },
      { titulo: "Print: Rafaela",    descricao: "Print disponível na seção de artes.", url: "artes.html", palavras: "rafaela print" }
    ];

    /* 2) LÓGICA (não precisa mexer) */
    const campo = document.getElementById("campo-busca");
    const botao = document.getElementById("botao-busca");
    const painel = document.getElementById("painel");
    const lista = document.getElementById("resultados");
    const aviso = document.getElementById("aviso");

    function normalizar(t) {
      return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }
    function escapar(t) {
      const d = document.createElement("div");
      d.textContent = t;
      return d.innerHTML;
    }
    function destacar(texto, termo) {
      const i = normalizar(texto).indexOf(normalizar(termo));
      if (i === -1) return escapar(texto);
      const n = normalizar(termo).length;
      return escapar(texto.slice(0, i)) + "<mark>" + escapar(texto.slice(i, i + n)) + "</mark>" + escapar(texto.slice(i + n));
    }
    function buscarLocal(termo) {
      const t = normalizar(termo);
      return dados.filter(item =>
        normalizar(item.titulo + " " + item.descricao + " " + (item.palavras || "")).includes(t)
      );
    }

    /* Quando o banco de dados estiver pronto, use esta função no lugar de buscarLocal.
       O servidor deve devolver JSON: [{ "titulo": "", "descricao": "", "url": "" }] */
    async function buscarNoServidor(termo) {
      const r = await fetch("/api/busca?q=" + encodeURIComponent(termo));
      if (!r.ok) throw new Error("Erro na busca");
      return r.json();
    }

    function fechar() { painel.hidden = true; }

    async function pesquisar() {
      const termo = campo.value.trim();
      lista.innerHTML = "";
      if (termo.length < 2) {
        if (!termo) { fechar(); return; }
        aviso.textContent = "Digite pelo menos 2 letras.";
        painel.hidden = false;
        return;
      }
      try {
        const achados = buscarLocal(termo);   // com banco: await buscarNoServidor(termo)
        painel.hidden = false;
        if (achados.length === 0) {
          aviso.textContent = "Nada encontrado para \"" + termo + "\".";
          return;
        }
        aviso.textContent = achados.length + (achados.length === 1 ? " resultado" : " resultados");
        lista.innerHTML = achados.map(item =>
          '<li><a href="' + encodeURI(item.url) + '">' +
          "<strong>" + destacar(item.titulo, termo) + "</strong>" +
          "<span>" + escapar(item.descricao) + "</span></a></li>"
        ).join("");
      } catch (e) {
        painel.hidden = false;
        aviso.textContent = "Não foi possível buscar agora. Tente novamente.";
      }
    }

    let espera;
    campo.addEventListener("input", () => { clearTimeout(espera); espera = setTimeout(pesquisar, 200); });
    campo.addEventListener("keydown", e => {
      if (e.key === "Enter") pesquisar();
      if (e.key === "Escape") fechar();
    });
    botao.addEventListener("click", pesquisar);
    document.addEventListener("click", e => { if (!e.target.closest(".busca")) fechar(); });
  </script>
</body>
</html>
